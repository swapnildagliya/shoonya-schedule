<!doctype html>
<html lang="{{LANG}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="google" content="notranslate"><meta name="weglot-translate" content="no"><title>{{TITLE}} — Shoonya Dance Centre</title><meta name="description" content="{{DESCRIPTION}}"><link rel="canonical" href="https://schedule.shoonyadance.com{{PREFIX}}/workshops/"><link rel="alternate" hreflang="en" href="https://schedule.shoonyadance.com/workshops/"><link rel="alternate" hreflang="nl" href="https://schedule.shoonyadance.com/nl/workshops/"><link rel="alternate" hreflang="x-default" href="https://schedule.shoonyadance.com/workshops/"><meta property="og:type" content="website"><meta property="og:title" content="{{TITLE}} — Shoonya"><meta property="og:description" content="{{DESCRIPTION}}"><meta property="og:url" content="https://schedule.shoonyadance.com{{PREFIX}}/workshops/"><meta property="og:image" content="https://workshops.shoonyadance.com/og-image.jpg"><meta property="og:site_name" content="Shoonya Dance Centre"><meta name="twitter:card" content="summary_large_image"><link rel="icon" href="https://workshops.shoonyadance.com/favicon.ico"><link rel="apple-touch-icon" href="https://workshops.shoonyadance.com/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Marcellus&family=PT+Serif:ital@0;1&family=Geist+Mono&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f1eb;--ink:#191919;--line:#d4d0ca;--quiet:#59544e;--purple:#b564f7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.55 'PT Serif',Georgia,serif}a{color:inherit;text-underline-offset:4px}button,select{font:inherit}button,summary,select{cursor:pointer}:focus-visible{outline:3px solid #8041ac;outline-offset:4px}[hidden]{display:none!important}.skip{position:absolute;left:16px;top:-80px;background:white;color:black;padding:12px;z-index:100}.skip:focus{top:10px}.site-header{background:#000;color:#fff;display:flex;gap:24px;align-items:center;justify-content:space-between;padding:24px max(24px,calc((100% - 1200px)/2))}.brand img{width:170px;height:auto}.header-links{display:flex;flex-wrap:wrap;gap:24px;font:16px Inter,Arial,sans-serif}.school{background:#000;color:#fff;padding:14px max(24px,calc((100% - 1200px)/2));display:flex;gap:28px;flex-wrap:wrap;border-top:1px solid #3b3b3b;font:16px Inter,Arial,sans-serif}.school a{padding:8px 0;text-decoration:none}.school [aria-current]{border-bottom:2px solid var(--purple)}main{max-width:1200px;padding:48px 24px 64px;margin:auto}h1,h2,h3{font-family:Marcellus,Georgia,serif;font-weight:400;margin:0}h1{font-size:clamp(36px,5vw,58px);line-height:1.1;margin:0 0 16px}h2{font-size:28px;margin:32px 0 12px}h3{font-size:25px;line-height:1.25;margin:4px 0 10px}h3 a{text-decoration:none}h3 a:hover{text-decoration:underline}p{margin:0}.filters{display:flex;gap:20px;flex-wrap:wrap;margin:32px 0 20px}label{display:flex;flex-direction:column;gap:8px;font:15px Inter,Arial,sans-serif}select{min-width:200px;border:1px solid #777;background:transparent;color:inherit;padding:12px}.workshop-row{display:grid;grid-template-columns:80px minmax(0,1fr) 240px;gap:24px;padding:28px 0;border-top:1px solid var(--line)}.date{font-family:'Geist Mono',monospace}.date span{font-size:34px}.date small{display:block;font-size:15px}.style,.location{color:var(--quiet);font-size:15px}.style{font-family:Inter,Arial,sans-serif}.facts{margin:10px 0;font-size:17px}.price{font:20px 'Geist Mono',monospace;margin-bottom:16px}.booking a{display:block;font-size:16px}.book{border:1px solid var(--ink);padding:12px;text-decoration:none}.book:hover{background:var(--ink);color:var(--paper)}.detail-link{margin-top:12px}details{margin-top:16px}summary{font-size:16px}details ul{padding-left:20px;font-size:16px}details li{margin:8px 0}.notice,.status{font-size:15px;color:var(--quiet)}.notice{margin-top:16px}.footnote{border-top:1px solid var(--line);padding-top:28px;margin-top:32px}.footnote a{display:inline-block;margin-top:8px}.reset{padding:10px 16px;border:1px solid var(--ink);background:transparent;color:inherit}.site-footer{background:#000;color:#fff;padding:36px 24px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:16px}.site-footer a{margin-right:24px}
@media(max-width:650px){main{padding-top:32px}.site-header{padding:20px 24px}.header-links{gap:16px}.brand img{width:130px}.workshop-row{grid-template-columns:48px minmax(0,1fr);gap:16px}.booking{grid-column:2;display:flex;flex-wrap:wrap;gap:12px;align-items:center}.price{width:100%;margin:0}.detail-link{margin:0}.date span{font-size:26px}h3{font-size:23px}.filters label{flex:1;min-width:140px}select{min-width:0;width:100%}.school{gap:20px}.facts{font-size:16px}}
</style><script src="https://links.shoonyadance.com/sdc-nav-sub.js" defer></script></head><body>
<a class="skip" href="#main">{{SKIP}}</a><header class="site-header"><a class="brand" href="https://www.shoonyadance.com/"><img src="/assets/shoonya-logo-script-purple.png" alt="Shoonya Dance Centre"></a><nav class="header-links" aria-label="Site"><a href="{{PREFIX}}/new/">{{NEW}}</a><a href="https://www.shoonyadance.com/contact">{{CONTACT}}</a><a href="{{ALT}}" lang="{{LANG}}">{{ALT_LABEL}}</a></nav></header>
<nav class="school" aria-label="Schedules"><a href="/?lang={{LANG}}">{{WEEKLY}}</a><a href="{{PREFIX}}/workshops/" aria-current="page">{{WORKSHOPS}}</a></nav>
<main id="main"><h1>{{TITLE}}</h1><p>{{INTRO}}</p><div class="filters"><label for="month">{{MONTH}}<select id="month"><option value="all">{{ALL_MONTHS}}</option></select></label><label for="style">{{STYLE}}<select id="style"><option value="all">{{ALL_STYLES}}</option></select></label></div><p class="status" id="result-count" role="status" aria-live="polite"></p><div id="rows">{{ROWS}}</div><div id="empty" hidden><p>{{EMPTY}}</p><button class="reset" type="button">{{RESET}}</button></div><p class="notice">{{UPDATED}} <time id="updated"></time>. {{NOTICE}}</p><p class="notice" id="stale" hidden><a href="https://portal.shoonyadance.com/register/workshop?lang={{LANG}}">{{CURRENT}} →</a></p><div class="footnote"><p>{{FOOT}}</p><a href="https://www.shoonyadance.com/calendar">{{CALENDAR}} →</a></div></main>
<footer class="site-footer"><div>Shoonya Dance Centre<br>Stapelplein 41 · 9000 Gent · Belgium</div><nav><a href="https://www.shoonyadance.com/contact">{{CONTACT}}</a><a href="https://www.shoonyadance.com/faq">FAQ</a></nav></footer>
<script type="application/json" id="workshop-data">{{DATA}}</script>
<script>
(()=>{'use strict';const data=JSON.parse(document.getElementById('workshop-data').textContent),lang=document.documentElement.lang,nl=lang==='nl',locale=nl?'nl-BE':'en-GB';const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Brussels',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const month=document.getElementById('month'),style=document.getElementById('style'),rows=[...document.querySelectorAll('.workshop-row')];function option(select,value,label){const o=document.createElement('option');o.value=value;o.textContent=label;select.append(o)}[...new Set(data.rows.filter(r=>r.endDate>=today).map(r=>r.date.slice(0,7)))].sort().forEach(m=>option(month,m,new Intl.DateTimeFormat(locale,{month:'long',year:'numeric',timeZone:'Europe/Brussels'}).format(new Date(m+'-15T12:00:00Z'))));[...new Set(data.rows.map(r=>r.style))].sort().forEach(s=>option(style,s,s==='Indian dance'&&nl?'Indiase dans':s==='Cuban salsa'&&nl?'Cubaanse salsa':s==='Other'&&nl?'Andere':s));function filter(){let count=0;rows.forEach(r=>{r.hidden=r.dataset.end<today||(month.value!=='all'&&r.dataset.date.slice(0,7)!==month.value)||(style.value!=='all'&&r.dataset.style!==style.value);if(!r.hidden)count++});document.querySelectorAll('.month-group').forEach(g=>g.hidden=![...g.querySelectorAll('.workshop-row')].some(r=>!r.hidden));document.getElementById('empty').hidden=count>0;document.getElementById('result-count').textContent=count+(nl?' workshopdagen':' workshop dates');}month.addEventListener('change',filter);style.addEventListener('change',filter);document.querySelector('.reset').addEventListener('click',()=>{month.value='all';style.value='all';filter()});const params=new URLSearchParams(location.search);if([...style.options].some(o=>o.value===params.get('style')))style.value=params.get('style');document.getElementById('updated').textContent=new Intl.DateTimeFormat(locale,{day:'numeric',month:'long',year:'numeric',timeZone:'Europe/Brussels'}).format(new Date(data.updated+'T12:00:00Z'));if((Date.now()-Date.parse(data.updated+'T00:00:00+01:00'))>3*86400000){document.getElementById('stale').hidden=false;document.querySelectorAll('.price').forEach(p=>p.textContent=nl?'Bekijk actuele prijs':'Check current price')}filter();})();
</script></body></html>
